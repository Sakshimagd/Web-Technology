<!DOCTYPE html>
<html>
<head>
    <title>My Home Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }


        nav {
            background-color: #444;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        
        .main {
            text-align: center;
            padding: 40px;
        }

        .main p {
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

       
        .dark {
            background-color: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="main">
        <h1 id="welcomeText">Welcome to My Home Page</h1>
        <p>This is a simple homepage created using HTML, CSS and DOM.</p>
        <button onclick="changeText()">Click Me</button>
        <button onclick="toggleMode()">Toggle Dark Mode</button>
    </div>

<script>
    function changeText() {
        document.getElementById("welcomeText").textContent =
            "You clicked the button!";
    }

    function toggleMode() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
